{% extends "base.html" %}

{% block title %}Create Warehouse{% endblock %}

{% block content %}
<h1>Create New Warehouse</h1>

<form action="{{ url_for('create_warehouse') }}" method="post">
    <p>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required>
    </p>
    <p>
        <label for="capacity">Capacity:</label><br>
        <input type="number" id="capacity" name="capacity" step="1" min="0" required>
    </p>
    <p>
        <label for="initial_balance">Initial Balance (optional):</label><br>
        <input type="number" id="initial_balance" name="initial_balance" step="1" min="0" value="0">
    </p>
    <button type="submit">Create</button>
</form>

<p><a href="{{ url_for('index') }}">Back to list</a></p>
{% endblock %}
